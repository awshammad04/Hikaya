# Free hackathon-demo resources. Free web services sleep after 15 idle minutes
# (about a minute to wake each), and the free database expires 30 days after
# creation with no backups.
#
# Free web services can't receive private-network traffic, so the frontend
# reaches the backend, and the backend reaches the AI service, over their public
# onrender.com URLs. The shared internal tokens keep both closed to visitors.
# If Render gives a service a different URL than the one below, update it here.
services:
  - type: web
    name: hikaya-frontend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: frontend
    # NODE_ENV=production would make npm skip the build tools (nest, esbuild).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    domains:
      - hikayapalestine.tech
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      # Link previews and canonical URLs use this address. Switch it to
      # https://hikayapalestine.tech once that domain's DNS points to Render.
      - key: APP_URL
        value: https://hikaya-frontend-p10x.onrender.com
      - key: HIKAYA_API_BASE_URL
        value: https://hikaya-api.onrender.com/api/v1
      - key: HIKAYA_INTERNAL_TOKEN
        fromService:
          type: web
          name: hikaya-api
          envVarKey: HIKAYA_INTERNAL_TOKEN
      # Covers the backend and AI waking up from sleep in turn.
      - key: API_PROXY_TIMEOUT_MS
        value: '180000'
      # Natural narration (Gemini TTS) runs here; reuse the AI service's key so
      # it is entered only once.
      - key: GEMINI_API_KEY
        fromService:
          type: web
          name: hikaya-ai
          envVarKey: GEMINI_API_KEY
  - type: web
    name: hikaya-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    # NODE_ENV=production would make npm skip the build tools (nest, esbuild).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      # Free web services can still send to a database in the same region.
      - key: DATABASE_URL
        fromDatabase:
          name: hikaya-postgres
          property: connectionString
      - key: HIKAYA_INTERNAL_TOKEN
        generateValue: true
      - key: AI_SERVICE_URL
        value: https://hikaya-ai.onrender.com
      - key: AI_INTERNAL_TOKEN
        fromService:
          type: web
          name: hikaya-ai
          envVarKey: AI_INTERNAL_TOKEN
      - key: AI_SERVICE_TIMEOUT_MS
        value: '150000'
      - key: HIKAYA_ADMIN_PHONES
        sync: false
  - type: web
    name: hikaya-ai
    runtime: python
    region: frankfurt
    plan: free
    # Repository root deliberately retained so content/ is available at runtime.
    buildCommand: pip install -r ai/requirements.txt
    startCommand: uvicorn service.app:app --app-dir ai --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: NODE_ENV
        value: production
      - key: AI_INTERNAL_TOKEN
        generateValue: true
      # Grounded guide answers and stories. With GEMINI_API_KEY set, provider
      # "auto" uses Gemini; with only ANTHROPIC_API_KEY it uses Anthropic; with
      # neither it serves the reviewed-content extractive engine.
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: HIKAYA_AI_PROVIDER
        value: auto
      - key: HIKAYA_AI_MODEL
        value: gemini-3.5-flash
      - key: HIKAYA_AI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
databases:
  - name: hikaya-postgres
    region: frankfurt
    plan: free
    databaseName: hikaya
    user: hikaya
    postgresMajorVersion: '17'
    ipAllowList: []
